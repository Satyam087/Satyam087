# Refreshes the "live from production" block in README.md from the portfolio's ledger endpoint.
name: live
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/live.mjs', '.github/workflows/live.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/live.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/live-dark.svg assets/live-light.svg
          git diff --cached --quiet || git commit -m "Live production numbers refreshed" && git push
