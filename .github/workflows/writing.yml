# Refreshes the Writing list in README.md from the site's RSS feed once a day.
name: writing
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://satyamkumarsingh.com/rss.xml'
          max_post_count: 5
          template: '- [$title]($url)'
          comment_tag_name: 'BLOG-POST-LIST'
          commit_message: 'Writing list refreshed from the RSS feed'
