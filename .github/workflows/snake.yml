# Renders the contribution graph as an animated snake SVG to the output branch, weekly and on demand.
name: snake
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Satyam087
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23b04a27
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23e8865e
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
